name: VELOOP Analytics Engine CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Automated Analytics Unit & Integration Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Compile dbt Model Syntax Verification
      run: |
        echo "Verifying dbt project structure and SQL model syntax..."
        test -f dbt_project/dbt_project.yml
        test -f dbt_project/models/staging/stg_users.sql
        test -f dbt_project/models/staging/stg_events.sql
        test -f dbt_project/models/marts/dim_user_lifecycle.sql
        test -f dbt_project/models/marts/fact_wallet_transactions.sql
        echo "All core dbt SQL transformations verified."
